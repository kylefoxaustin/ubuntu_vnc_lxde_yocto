; Service definitions for ubuntu_vnc_lxde_yocto.
;
; The [program:web] Flask/gevent backend that used to live here has been
; removed. Its only consumer was the Vue frontend, which is gone; its pinned
; Python 2 dependencies carried all 40 of this repo's runtime CVE alerts, and
; they could not be upgraded on Ubuntu 18.04 (Python 3.6 predates modern
; Flask/Werkzeug/gevent). See SECURITY.md.
;
; The [program:novnc] entry that shelled out to the vendored
; novnc/utils/launch.sh is now [program:websockify], using the apt-installed
; websockify so it receives distro security updates.

[supervisord]
redirect_stderr=true
stopsignal=QUIT
autorestart=true
directory=/root

[program:nginx]
priority=10
command=nginx -c /etc/nginx/nginx.conf -g 'daemon off;'
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/1
stderr_logfile_maxbytes=0

[group:x]
programs=xvfb,wm,lxpanel,pcmanfm,x11vnc,websockify

[program:xvfb]
priority=10
command=/usr/local/bin/xvfb.sh
stopsignal=KILL

[program:wm]
priority=15
command=/usr/bin/openbox
environment=DISPLAY=":1",HOME="/root",USER="root"

[program:lxpanel]
priority=15
directory=%HOME%
command=/usr/bin/lxpanel --profile LXDE
user=%USER%
environment=DISPLAY=":1",HOME="%HOME%",USER="%USER%"

[program:pcmanfm]
priority=15
directory=%HOME%
command=/usr/bin/pcmanfm --desktop --profile LXDE
user=%USER%
environment=DISPLAY=":1",HOME="%HOME%",USER="%USER%"

; startup.sh appends `-rfbauth /.password2` to this line when VNC_PASSWORD is
; set. With no password, anyone who can reach this port gets the desktop.
[program:x11vnc]
priority=20
command=x11vnc -display :1 -xkb -forever -shared -repeat

; Serves the noVNC client over HTTP and bridges browser WebSockets to x11vnc.
; nginx proxies /websockify here.
[program:websockify]
priority=25
command=/usr/bin/websockify --web /usr/local/lib/web/frontend 6081 127.0.0.1:5900
stopasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/1
stderr_logfile_maxbytes=0
